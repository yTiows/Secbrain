# One-command cloud deploy:  ./deploy/fly.sh
app = "secbrain-CHANGE-ME"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  BRAIN_DATA_DIR = "/data"
  BRAIN_HOST = "0.0.0.0"

[mounts]
  source = "secbrain_data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"      # keep running: background maintenance, inbox and backups need a live process
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
