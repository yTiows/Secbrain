[project]
name = "secbrain"
version = "0.1.0"
description = "Personal knowledge intelligence system (second brain)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]
phone = ["qrcode>=7.4", "pillow>=10"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools]
packages = ["brain", "brain.ingest", "brain.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
